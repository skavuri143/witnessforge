name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Example gates
        run: |
          for ex in claims/claim eligibility/member; do
            dir=examples/${ex%/*}
            witnessforge generate $dir/${ex#*/}.cpy $dir/mapping.yaml -o out/${ex%/*} --min-score 1.0
            witnessforge verify $dir/${ex#*/}.cpy $dir/mapping.yaml --input out/${ex%/*}/witnesses.dat \
              --actual out/${ex%/*}/expected.jsonl --rejects out/${ex%/*}/expected_rejects.jsonl
          done
